<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #100D12; --panel: #1B1520; --card: #211A24; --line: #33293A; --ink: #F5EBDD; --dim: #A3958A; --faint: #6E6259; --gold: #F5B45C;
  --z: 1;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Figtree, system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0; letter-spacing: -.01em; }
button { font: inherit; color: inherit; }

/* ---------- the world ---------- */
#stage { position: fixed; inset: 0; cursor: grab; touch-action: none; background: radial-gradient(ellipse at 50% 0%, #241a22 0%, var(--bg) 60%); }
#stage.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#stage.moving #world { will-change: transform; }
.floor { position: absolute; border-radius: 80px; background-image: radial-gradient(circle, #ffffff10 2px, transparent 2.5px); background-size: 60px 60px; }

.col { position: absolute; border-radius: 48px; background: color-mix(in srgb, var(--s) 7%, transparent); border: 3px solid color-mix(in srgb, var(--s) 22%, transparent); transition: left .9s cubic-bezier(.2,.8,.2,1), width .9s cubic-bezier(.2,.8,.2,1), height .9s cubic-bezier(.2,.8,.2,1); }
.col .ch { position: absolute; left: 48px; right: 48px; top: 36px; display: flex; flex-direction: column; gap: 6px; }
.col .cn { font-family: Fraunces, serif; font-weight: 600; font-size: min(calc(150px * var(--z)), 230px); line-height: .9; color: var(--s); font-variant-numeric: tabular-nums; transform-origin: 0 0; }
.col .cl { font-family: Fraunces, serif; font-size: min(calc(64px * var(--z)), 120px); line-height: 1.02; color: var(--ink); }
.col .hint { font-size: 26px; color: var(--dim); }
#stage.l0 .col .hint { display: none; }
#stage.l0 .col .cn { font-size: min(calc(110px * var(--z)), 200px); }
.col.empty { opacity: .55; }
.col:hover { border-color: color-mix(in srgb, var(--s) 45%, transparent); }

.abox { position: absolute; border-radius: 36px; background: color-mix(in srgb, var(--c) 6%, #ffffff03); border: 2px dashed color-mix(in srgb, var(--c) 30%, transparent); }
.abox .al { position: absolute; left: 36px; top: 18px; font-family: Fraunces, serif; font-size: calc(46px * min(var(--z), 2.2)); color: var(--c); white-space: nowrap; }
.abox .al small { font-family: Figtree, sans-serif; font-size: .55em; color: var(--dim); margin-left: 12px; }

.arrow { position: absolute; width: 80px; height: 120px; display: grid; place-items: center; color: #ffffff30; font-size: 120px; font-family: Fraunces, serif; pointer-events: none; }

/* ideas */
.tile { position: absolute; left: 0; top: 0; width: 300px; height: 150px; border-radius: 22px; background: var(--card); border: 2px solid #ffffff10; border-left: 10px solid var(--c); padding: 14px 18px 14px 16px; overflow: hidden; display: flex; flex-direction: column; gap: 6px;
  transition: transform 1.1s cubic-bezier(.2,.85,.2,1), opacity .5s, background .4s, box-shadow .4s; cursor: pointer; }
.tile:hover { border-color: #ffffff40; border-left-color: var(--c); background: #2a2130; }
.tile .tid { display: flex; justify-content: space-between; gap: 8px; font-size: 17px; color: var(--dim); white-space: nowrap; }
.tile .tid b { color: var(--c); font-weight: 700; }
.tile .tid span { overflow: hidden; text-overflow: ellipsis; }
.tile .tt { font-size: 27px; font-weight: 600; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .td, .tile .tm { display: none; }
.tile .bar { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--gold); border-radius: 0 6px 0 0; transition: width .8s; }
.tile.st-building { box-shadow: 0 0 0 3px #F5B45C88, 0 0 40px #F5B45C55; animation: breathe 2.4s ease-in-out infinite; }
.tile.st-verified, .tile.st-shipped { background: color-mix(in srgb, var(--s) 10%, var(--card)); }
.tile.st-dropped { opacity: .45; }
.tile.st-blocked { box-shadow: 0 0 0 3px #F07060aa; }
.tile.sel { box-shadow: 0 0 0 5px var(--ink), 0 20px 60px #000a !important; z-index: 2; }
.tile.born { animation: born 1.2s cubic-bezier(.2,.85,.2,1); }
@keyframes breathe { 50% { box-shadow: 0 0 0 3px #F5B45Ccc, 0 0 70px #F5B45C88; } }
@keyframes born { from { opacity: 0; filter: brightness(3); } }

#stage.l0 .tile { background: var(--c); border: none; padding: 0; border-radius: 26px; }
#stage.l0 .tile > * { display: none; }
#stage.l0 .tile.st-building { background: var(--gold); }
#stage.l0 .tile.st-dropped { opacity: .25; }
#stage.l2 .tile .tt { font-size: 21px; -webkit-line-clamp: 2; }
#stage.l2 .tile .td { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14.5px; line-height: 1.35; color: var(--dim); }
#stage.l2 .tile .tm { display: flex; gap: 8px; align-items: center; margin-top: auto; font-size: 13px; color: var(--dim); }
#stage.l2 .tile .tid { font-size: 14px; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 99px; background: #ffffff12; color: var(--ink); font-size: 12.5px; font-weight: 600; }
.imp { color: var(--gold); letter-spacing: 1px; }
.own { padding: 1px 9px; border-radius: 99px; background: color-mix(in srgb, var(--oc) 22%, transparent); color: var(--oc); font-weight: 600; }

#stage.q .tile:not(.hit) { opacity: .12; }
#stage.q .tile.hit { box-shadow: 0 0 0 4px var(--ink); }

/* agents */
.agent { position: absolute; left: 0; top: 0; width: 440px; height: 330px; border-radius: 40px; background: linear-gradient(160deg, color-mix(in srgb, var(--ac) 16%, var(--panel)), var(--panel) 70%); border: 3px solid color-mix(in srgb, var(--ac) 40%, transparent); padding: 26px 28px; overflow: hidden; cursor: pointer; transition: transform .9s cubic-bezier(.2,.8,.2,1), box-shadow .4s; }
.agent:hover { border-color: var(--ac); }
.agent.sel { box-shadow: 0 0 0 6px var(--ink); }
.agent .orb { position: absolute; right: 26px; top: 26px; width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff8, var(--ac) 45%, color-mix(in srgb, var(--ac) 40%, #000)); box-shadow: 0 0 30px var(--ac); }
.agent.on .orb { animation: orb 1.6s ease-in-out infinite; }
@keyframes orb { 50% { transform: scale(1.18); box-shadow: 0 0 70px var(--ac); } }
.agent .an { font-family: Fraunces, serif; font-size: 44px; font-weight: 600; color: var(--ac); line-height: 1; }
.agent .am { margin-top: 8px; font-size: 17px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
.agent .as { margin-top: 14px; font-size: 22px; font-weight: 600; color: var(--dim); display: flex; align-items: center; gap: 10px; }
.agent .as::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--faint); }
.agent.on .as { color: var(--ink); }
.agent.on .as::before { background: #8CE0A8; box-shadow: 0 0 12px #8CE0A8; }
.agent .ac { margin-top: 8px; font-size: 18px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .pbar { margin-top: 10px; height: 8px; border-radius: 9px; background: #ffffff12; overflow: hidden; }
.agent .pbar i { display: block; height: 100%; background: var(--ac); border-radius: 9px; transition: width .8s; }
.agent .wf { display: none; margin-top: 14px; gap: 6px; flex-wrap: wrap; }
.agent .wf span { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: #ffffff0c; color: var(--faint); }
.agent .wf span.past { color: var(--dim); }
.agent .wf span.now { background: var(--ac); color: #1B1520; font-weight: 700; }
.agent .recent { display: none; margin: 12px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--dim); }
.agent .recent li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }
.agent .recent time { color: var(--faint); margin-right: 8px; }
#stage.l2 .agent .wf { display: flex; }
#stage.l2 .agent .recent { display: block; }
#stage.l0 .agent { background: color-mix(in srgb, var(--ac) 22%, var(--panel)); }
#stage.l0 .agent > :not(.an):not(.orb) { display: none; }
#stage.l0 .agent .an { font-size: min(calc(54px * var(--z)), 84px); margin-top: 90px; text-align: center; color: var(--ink); white-space: nowrap; }
#stage.l0 .agent .orb { left: 50%; top: 40px; margin-left: -40px; width: 80px; height: 80px; }
.ring { position: absolute; border-radius: 48px; border: 6px solid var(--ac); pointer-events: none; animation: ring 1.4s ease-out forwards; }
@keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.35); } }

/* links and comets */
#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; opacity: .55; }
#links path.q { opacity: .18; }
#links path.cur { stroke-width: 3.5; opacity: .95; }
@keyframes dash { to { stroke-dashoffset: -28; } }
.comet { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; offset-rotate: 0deg; animation: fly 1.5s cubic-bezier(.5,0,.3,1) forwards; }
@keyframes fly { from { offset-distance: 0%; opacity: 1; } 85% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }

/* simulator */
.sim { position: absolute; width: 420px; height: 880px; border-radius: 70px; background: #000; border: 14px solid #2a2330; box-shadow: 0 30px 90px #000c, inset 0 0 0 2px #ffffff18; overflow: hidden; cursor: pointer; }
.sim img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sim .sl { position: absolute; left: 0; right: 0; top: -150px; text-align: center; font-family: Fraunces, serif; font-size: calc(56px * var(--z)); color: var(--ink); white-space: nowrap; }
.simwrap { position: absolute; }
.simwrap .sl { position: absolute; left: -200px; right: -200px; bottom: calc(100% + 30px); text-align: center; font-family: Fraunces, serif; font-size: calc(54px * var(--z)); white-space: nowrap; }
.simwrap .sl small { display: block; font-family: Figtree, sans-serif; font-size: .45em; color: var(--dim); }

/* ---------- the HUD ---------- */
.hud { position: fixed; z-index: 10; }
.glass { background: #1B1520d9; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid #ffffff14; border-radius: 18px; box-shadow: 0 10px 40px #0008; }
#top { left: 16px; top: 16px; right: 16px; display: flex; gap: 12px; align-items: center; pointer-events: none; }
#top > * { pointer-events: auto; }
#brand { padding: 10px 16px; display: flex; flex-direction: column; }
#brand h1 { font-size: 20px; line-height: 1.1; }
#brand .crumbs { font-size: 13px; color: var(--dim); margin-top: 2px; white-space: nowrap; }
#brand .crumbs b { color: var(--ink); font-weight: 600; }
#kpis { display: flex; gap: 6px; padding: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.kpi { padding: 6px 12px; border-radius: 12px; background: #ffffff08; display: flex; flex-direction: column; min-width: 74px; }
.kpi b { font-family: Fraunces, serif; font-size: 22px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.kpi.warn b { color: #F0845A; }
#search { width: 200px; padding: 10px 14px; border-radius: 14px; border: 1px solid #ffffff1a; background: #1B1520d9; color: var(--ink); font: inherit; outline: none; }
#search:focus { border-color: var(--gold); }
.lnk { padding: 10px 14px; text-decoration: none; color: var(--dim); font-size: 13px; white-space: nowrap; }
.lnk:hover { color: var(--ink); }

#zoom { left: 16px; bottom: 112px; display: flex; flex-direction: column; padding: 4px; gap: 2px; }
#zoom button { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 12px; font-size: 20px; cursor: pointer; color: var(--ink); }
#zoom button:hover { background: #ffffff12; }
#lod { left: 66px; bottom: 118px; padding: 8px 12px; font-size: 12.5px; color: var(--dim); display: flex; gap: 10px; }
#lod span.on { color: var(--gold); font-weight: 700; }

#bottom { left: 16px; right: 16px; bottom: 16px; padding: 12px 16px; display: flex; gap: 14px; align-items: center; }
#play { flex: none; height: 44px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--gold); color: #1B1520; font-weight: 700; cursor: pointer; white-space: nowrap; }
#play:hover { filter: brightness(1.08); }
#tl { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#tlrow { display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--dim); min-width: 0; }
#tlrow b { color: var(--ink); white-space: nowrap; }
#tlmsg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#live { margin-left: auto; white-space: nowrap; display: flex; gap: 6px; align-items: center; cursor: pointer; }
#live::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
#live.on { color: #8CE0A8; }
#live.on::before { background: #8CE0A8; box-shadow: 0 0 10px #8CE0A8; animation: orb 1.6s infinite; }
#scrub { position: relative; height: 26px; cursor: pointer; }
#scrub canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#scrub input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }

#mini { right: 16px; bottom: 112px; padding: 6px; cursor: crosshair; }
#mini canvas { display: block; width: 240px; height: 150px; border-radius: 12px; }

#panel { right: 16px; top: 84px; bottom: 112px; width: 400px; padding: 22px; overflow-y: auto; transform: translateX(440px); opacity: 0; transition: transform .45s cubic-bezier(.2,.85,.2,1), opacity .3s; }
#panel.open { transform: none; opacity: 1; }
#panel .x { position: sticky; top: 0; float: right; width: 34px; height: 34px; border-radius: 10px; border: 0; background: #ffffff12; cursor: pointer; font-size: 18px; }
#panel h2 { font-size: 28px; line-height: 1.12; margin: 4px 0 10px; }
#panel .eyebrow { font-size: 13px; color: var(--dim); }
#panel .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
#panel p { color: #E2D6C6; line-height: 1.5; margin: 10px 0; }
#panel h3 { font-family: Figtree, sans-serif; font-size: 13px; font-weight: 700; color: var(--dim); margin: 22px 0 8px; }
#panel .hist { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid #ffffff14; }
#panel .hist li { position: relative; padding: 0 0 14px 6px; font-size: 14px; line-height: 1.4; }
#panel .hist li::before { content: ''; position: absolute; left: -23px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--ac, var(--faint)); }
#panel .hist .when { font-size: 12px; color: var(--faint); display: block; }
#panel .hist .who { font-weight: 700; color: var(--ac); }
#panel .shot { width: 100%; border-radius: 14px; margin: 6px 0; border: 1px solid #ffffff14; }
#panel .go { cursor: pointer; text-decoration: underline; text-decoration-color: #ffffff30; text-underline-offset: 3px; }
#panel .go:hover { text-decoration-color: currentColor; }
#panel .items { list-style: none; margin: 0; padding: 0; }
#panel .items li { padding: 8px 10px; border-radius: 10px; font-size: 14px; display: flex; gap: 10px; cursor: pointer; }
#panel .items li:hover { background: #ffffff0c; }
#panel .items li i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; margin-top: 5px; }
#panel .bars { display: flex; flex-direction: column; gap: 5px; }
#panel .bars div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
#panel .bars span { width: 120px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel .bars em { height: 10px; border-radius: 5px; background: var(--c); }
#panel .wfp { display: flex; gap: 6px; flex-wrap: wrap; }
#panel .wfp span { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: #ffffff0c; color: var(--dim); }
#panel .wfp span.now { background: var(--ac); color: #1B1520; font-weight: 700; }
#panel .big { font-family: Fraunces, serif; font-size: 40px; line-height: 1; }
#panel .pb { height: 8px; border-radius: 9px; background: #ffffff12; overflow: hidden; margin: 8px 0; }
#panel .pb i { display: block; height: 100%; background: var(--gold); }

#tick { left: 16px; bottom: 262px; width: 360px; display: flex; flex-direction: column-reverse; gap: 6px; pointer-events: none; }
#tick div { padding: 8px 12px; font-size: 13px; line-height: 1.35; border-left: 4px solid var(--ac); animation: tin .5s cubic-bezier(.2,.85,.2,1); }
#tick div b { color: var(--ac); }
@keyframes tin { from { opacity: 0; transform: translateX(-20px); } }

#hint { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 18px 24px; text-align: center; font-size: 15px; color: var(--dim); transition: opacity .8s; pointer-events: none; }
#hint b { color: var(--ink); font-family: Fraunces, serif; font-size: 24px; display: block; margin-bottom: 6px; font-weight: 600; }

@media (max-width: 900px) {
  #kpis .kpi:nth-child(n+4), #mini, #lod, #tick, .lnk { display: none; }
  #search { width: 120px; }
  #top { flex-wrap: wrap; }
  #kpis { order: 3; margin-left: 0; flex-wrap: nowrap; }
  .kpi { min-width: 0; }
  #panel { left: 16px; right: 16px; width: auto; top: auto; height: 55vh; bottom: 100px; transform: translateY(110%); }
  #play { padding: 0 12px; }
}
</style>
</head>
<body>
<div id="stage" class="l0"><div id="world"><svg id="links" width="1" height="1"></svg></div></div>

<div id="top" class="hud">
  <div id="brand" class="glass"><h1>Work map</h1><div class="crumbs" id="crumbs">Whole round</div></div>
  <input id="search" placeholder="Find an idea or agent" autocomplete="off" spellcheck="false">
  <div id="kpis" class="glass"></div>
  <a class="lnk glass" href="/index.html">Classic view</a>
</div>
<div id="zoom" class="hud glass"><button id="zin" title="Zoom in (+)">+</button><button id="zfit" title="See everything (0)">⌂</button><button id="zout" title="Zoom out (-)">−</button></div>
<div id="lod" class="hud glass"><span data-l="0">Overview</span><span data-l="1">Titles</span><span data-l="2">Detail</span></div>
<div id="tick" class="hud"></div>
<div id="mini" class="hud glass"><canvas width="480" height="300"></canvas></div>
<aside id="panel" class="hud glass"></aside>
<div id="bottom" class="hud glass">
  <button id="play">Replay the day</button>
  <div id="tl">
    <div id="tlrow"><b id="tltime">Live</b><span id="tlmsg"></span><span id="live" class="on">Live</span></div>
    <div id="scrub"><canvas></canvas><input id="range" type="range" min="0" max="1" value="1" step="1" aria-label="Scrub through the day"></div>
  </div>
</div>
<div id="hint" class="hud glass"><b>The whole round, from above</b>Scroll or pinch to zoom in, and more detail appears.<br>Drag to move. Tap anything to fly to it.</div>

<script>
const STAGES = ['backlog', 'queued', 'building', 'checked', 'review', 'integrated', 'verified', 'shipped'];
const STAGE_COLOR = { backlog: '#7E7266', queued: '#C3B3A0', building: '#F5B45C', checked: '#B9D98A', review: '#AFA2DE', integrated: '#7FB8F0', verified: '#8CC0A8', shipped: '#FFDCA6', blocked: '#F07060', dropped: '#5d5249' };
const SNAP = window.__SNAPSHOT__ || null;
let NOW = Date.now();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function ago(t, now = NOW) {
  const s = Math.max(0, Math.round((now - new Date(t).getTime()) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m ago`;
}
const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

// ---------- fold events into state (same as the classic view) ----------
function derive(s) {
  const agents = new Map(s.team.agents.map((a) => [a.id, { ...a, events: [], files: new Set(), claimed: new Set(), handed: new Set(), checksOk: 0, checksFail: 0, last: null, cur: null, pct: 0, step: -1, filed: 0 }]));
  const ideas = new Map();
  for (const i of s.ideas) {
    const status = i.status === 'verified' ? 'verified' : i.status === 'dropped' ? 'dropped' : i.status === 'shipped' ? 'shipped' : i.owner && i.owner !== 'atlas' ? 'queued' : i.owner === 'atlas' ? 'queued' : 'backlog';
    ideas.set(i.id, { ...i, status, history: [], pct: 0, by: null });
  }
  let n = 0;
  for (const e of s.events) {
    const a = agents.get(e.agent);
    if (e.type === 'idea' && e.title) {
      n++;
      let id = e.id || `S${String(n).padStart(3, '0')}`;
      while (ideas.has(id)) id += "'";
      ideas.set(id, { id, area: e.area || 'craft', size: e.size || 'M', impact: e.impact || 2, owner: null, title: e.title, detail: e.msg, tags: (e.tags || '').split(/\s+/).filter(Boolean), status: 'backlog', history: [e], pct: 0, by: e.agent, fresh: e.t });
      if (a) a.filed++;
    }
    if (a) {
      a.events.push(e);
      a.last = e;
      (e.files || []).forEach((f) => a.files.add(f));

// ---------- layout: where everything lives in the world ----------
const TW = 300, TH = 150, GX = 24, GY = 24, PX = TW + GX, PY = TH + GY, PAD = 48, HEAD = 440, CG = 160;
const AW = 440, AH = 330;
let S = null, D = null, L = null, AREA = new Map(), AIDX = new Map();
let cursor = null; // null = live, else number of events shown
let sel = null; // 'i:ID' | 'a:ID' | 'c:stage' | 'sim'
let query = '';

function layout(D) {
  const pos = new Map(), cols = [];
  const ideas = [...D.ideas.values()];
  const sorter = (a, b) => (AIDX.get(a.area) ?? 99) - (AIDX.get(b.area) ?? 99) || (b.impact || 0) - (a.impact || 0) || a.id.localeCompare(b.id);
  const by = (s) => ideas.filter((i) => i.status === s).sort(sorter);

  // The idea bank: one box per area, packed into three columns.
  const back = by('backlog');
  const groups = [];
  for (const a of S.areas) { const items = back.filter((i) => i.area === a.key); if (items.length) groups.push({ a, items }); }
  const stray = back.filter((i) => !AREA.has(i.area));
  if (stray.length) groups.push({ a: { key: 'other', label: 'Other', color: '#7E7266' }, items: stray });
  const BC = 4, BP = 36, LBL = 100, NB = 3, BW = BC * PX - GX + BP * 2, BG = 48;
  const colY = new Array(NB).fill(HEAD + 20);
  const boxes = [];
  for (const g of groups) {
    const c = colY.indexOf(Math.min(...colY));
    const bx = PAD + c * (BW + BG), by0 = colY[c];
    const rows = Math.ceil(g.items.length / BC);
    g.items.forEach((it, i) => pos.set(it.id, { x: bx + BP + (i % BC) * PX, y: by0 + LBL + Math.floor(i / BC) * PY }));
    const h = LBL + rows * PY - GY + BP;
    boxes.push({ x: bx, y: by0, w: BW, h, a: g.a, n: g.items.length });
    colY[c] += h + BG;
  }
  const backW = PAD * 2 + NB * BW + (NB - 1) * BG;
  cols.push({ key: 'backlog', x: 0, w: backW, h: Math.max(...colY) + PAD - BG, n: back.length, boxes });

  let x = backW + CG;
  for (const s of [...STAGES.slice(1), 'blocked', 'dropped']) {
    const items = by(s);
    const nc = Math.min(3, Math.max(1, Math.ceil(items.length / 12)));
    items.forEach((it, i) => pos.set(it.id, { x: x + PAD + (i % nc) * PX, y: HEAD + 20 + Math.floor(i / nc) * PY }));
    const w = Math.max(PAD * 2 + nc * PX - GX, 520);
    if (nc === 1) items.forEach((it) => { pos.get(it.id).x = x + (w - TW) / 2; });
    const rows = Math.max(4, Math.ceil(items.length / nc));
    cols.push({ key: s, x, w, h: HEAD + 20 + rows * PY - GY + PAD, n: items.length });
    x += w + CG;
  }
  const sim = { x: x + 120, y: HEAD + 160, w: 420, h: 880 };
  const right = sim.x + sim.w + PAD;

  const ag = [...D.agents.values()];
  const gap = Math.max(60, (right - ag.length * AW) / (ag.length + 1));
  const apos = new Map();
  ag.forEach((a, i) => apos.set(a.id, { x: gap + i * (AW + gap), y: -AH - 300, w: AW, h: AH }));
  const height = Math.max(...cols.map((c) => c.h), sim.y + sim.h);
  const top = -AH - 420;
  return { pos, cols, sim, apos, bounds: { x: -PAD * 2, y: top, w: right + PAD * 4, h: height - top + PAD * 2 } };
}

// ---------- the camera ----------
const stage = document.getElementById('stage'), world = document.getElementById('world'), linksSvg = document.getElementById('links');
const view = { x: 0, y: 0, k: 0.15 };

  stage.style.setProperty('--z', Math.min(5, Math.max(1, 0.32 / view.k)).toFixed(3));
  const l = lodOf(view.k);
  if (l !== lod) {
    lod = l;

}

  const x = (evs.length / n) * w;
  g.fillStyle = '#F5EBDD'; g.fillRect(Math.min(w - 3, x), 0, 3, h);
}

// what's in the middle of the screen, as a trail
let crumbT = 0;
function crumbsSoon() { if (!crumbT) { crumbT = 1; frame(() => { crumbT = 0; crumbs(); }); } }
function crumbs() {
  if (!L) return;
  const cx = (innerWidth / 2 - view.x) / view.k, cy = (innerHeight / 2 - view.y) / view.k;
  const parts = [`<span class="go" data-go="fit">${esc(S.team.round)}</span>`];
  if (lod > 0) {
    if (cy < -40) parts.push('The team');
    else {
      const c = L.cols.find((c) => cx >= c.x && cx <= c.x + c.w);
      if (c) {
        parts.push(`<span class="go" data-go="c:${c.key}">${esc(STAGE_INFO()[c.key]?.label || c.key)}</span>`);
        const bx = (c.boxes || []).find((b) => cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h);
        if (bx) parts.push(esc(bx.a.label));
      } else if (cx >= L.sim.x - 200) parts.push('The app, live');
    }
  }
  if (sel?.startsWith('i:')) parts.push(`<b>${esc(sel.slice(2))}</b>`);
  if (sel?.startsWith('a:')) parts.push(`<b>${esc(D.agents.get(sel.slice(2))?.name)}</b>`);
  document.getElementById('crumbs').innerHTML = parts.join(' › ');
}

// minimap
let miniT = 0;
function miniSoon() { if (!miniT) { miniT = 1; frame(() => { miniT = 0; mini(); }); } }
function mini() {
  if (!L) return;
  const cv = document.querySelector('#mini canvas'), g = cv.getContext('2d'), W = cv.width, H = cv.height, b = L.bounds;
  const s = Math.min(W / b.w, H / b.h), ox = (W - b.w * s) / 2 - b.x * s, oy = (H - b.h * s) / 2 - b.y * s;
  cv._m = { s, ox, oy };
  g.clearRect(0, 0, W, H);
  for (const c of L.cols) { g.fillStyle = STAGE_COLOR[c.key] + '22'; g.fillRect(ox + c.x * s, oy, c.w * s, c.h * s); }
  for (const it of D.ideas.values()) { const p = L.pos.get(it.id); if (!p) continue; g.fillStyle = it.status === 'building' ? '#F5B45C' : AREA.get(it.area)?.color || '#7E7266'; g.fillRect(ox + p.x * s, oy + p.y * s, Math.max(1.5, TW * s), Math.max(1.5, TH * s)); }
  for (const a of D.agents.values()) { const p = L.apos.get(a.id); g.fillStyle = a.color; g.fillRect(ox + p.x * s, oy + p.y * s, AW * s, AH * s); }
  g.fillStyle = '#ffffff30'; g.fillRect(ox + L.sim.x * s, oy + L.sim.y * s, L.sim.w * s, L.sim.h * s);
  const vx = (-view.x / view.k) * s + ox, vy = (-view.y / view.k) * s + oy, vw = (innerWidth / view.k) * s, vh = (innerHeight / view.k) * s;
  g.strokeStyle = '#F5EBDD'; g.lineWidth = 2; g.strokeRect(vx, vy, vw, vh);
}

// ---------- the detail panel ----------
const panelEl = document.getElementById('panel');
function histHTML(list) {
  return `<ul class="hist">${list.slice().reverse().map((e) => {
    const a = D.agents.get(e.agent);
    return `<li style="--ac:${a?.color || '#888'}"><span class="when">${hhmm(e.t)}, ${ago(e.t)}</span><span class="who go" data-go="a:${esc(e.agent)}">${esc(a?.name || e.agent)}</span> ${esc(e.msg || e.type)}${e.shot ? `<img class="shot" src="/live/shots/${encodeURIComponent(e.shot)}" alt="" loading="lazy">` : ''}</li>`;
  }).join('')}</ul>`;
}
function itemsHTML(list) {
  return `<ul class="items">${list.slice(0, 150).map((i) => `<li data-go="i:${esc(i.id)}" style="--c:${AREA.get(i.area)?.color || '#888'}"><i></i><span><b>${esc(i.id)}</b> ${esc(i.title)}</span></li>`).join('')}</ul>`;
}
function panel(key, quiet) {
  let h = '';
  if (key.startsWith('i:')) {
    const it = D.ideas.get(key.slice(2));
    if (!it) return closePanel();
    const ar = AREA.get(it.area), o = it.owner && D.agents.get(it.owner), info = STAGE_INFO()[it.status];
    h = `<div class="eyebrow">${esc(it.id)}, ${esc(ar?.label || it.area)}</div><h2>${esc(it.title)}</h2>
<div class="row"><span class="chip" style="background:${STAGE_COLOR[it.status]};color:#1B1520">${esc(info?.label || it.status)}</span><span class="chip">Size ${esc(it.size || 'M')}</span><span class="chip">Impact ${'●'.repeat(it.impact || 0)}</span>${o ? `<span class="own go" data-go="a:${o.id}" style="--oc:${o.color}">${esc(o.name)}</span>` : ''}${it.by ? `<span class="chip">Filed by ${esc(D.agents.get(it.by)?.name || it.by)}</span>` : ''}</div>
${it.detail ? `<p>${esc(it.detail)}</p>` : ''}
${it.status === 'building' || it.pct ? `<div class="pb"><i style="width:${it.pct || 4}%"></i></div>` : ''}
<h3>Where it is</h3><p style="margin:0;color:var(--dim)">${esc(info?.hint || '')}</p>
<h3>Its story</h3>${it.history.length ? histHTML(it.history) : '<p style="color:var(--dim)">Nothing has happened to this one yet. It waits in the idea bank for a wave.</p>'}`;
  } else if (key.startsWith('a:')) {
    const a = D.agents.get(key.slice(2));
    if (!a) return closePanel();
    const st = agentState(a, NOW);
    const mine = [...D.ideas.values()].filter((i) => i.owner === a.id || a.claimed.has(i.id) || a.handed.has(i.id));
    h = `<div class="eyebrow" style="color:${a.color}">${esc(a.role)}, ${esc(a.model)}</div><h2 style="color:${a.color}">${esc(a.name)}</h2>
<div class="row"><span class="chip">${esc(st.label)}</span><span class="chip">${a.checksOk} gates passed</span>${a.checksFail ? `<span class="chip">${a.checksFail} failed</span>` : ''}${a.filed ? `<span class="chip">${a.filed} ideas filed</span>` : ''}</div>
<p>${esc(a.mission)}</p>
<h3>Workflow</h3><div class="wfp" style="--ac:${a.color}">${a.workflow.map((w, i) => `<span class="${i === a.step ? 'now' : ''}">${esc(w)}</span>`).join('')}</div>
<h3>Owns</h3><p style="margin:0;color:var(--dim)">${a.owns.map(esc).join(', ')}</p>
${mine.length ? `<h3>Its ideas</h3>${itemsHTML(mine)}` : ''}
${a.files.size ? `<h3>Files touched</h3><p style="margin:0;color:var(--dim);font-size:13px">${[...a.files].slice(0, 30).map(esc).join('<br>')}</p>` : ''}
<h3>Everything it did</h3>${a.events.length ? histHTML(a.events) : '<p style="color:var(--dim)">Hasn\'t started yet.</p>'}`;
  } else if (key.startsWith('c:')) {
    const s = key.slice(2), info = STAGE_INFO()[s], list = [...D.ideas.values()].filter((i) => i.status === s);
    const byArea = S.areas.map((a) => ({ a, n: list.filter((i) => i.area === a.key).length })).filter((x) => x.n).sort((x, y) => y.n - x.n);
    const max = Math.max(1, ...byArea.map((x) => x.n));
    h = `<div class="eyebrow">Stage</div><h2 style="color:${STAGE_COLOR[s]}">${esc(info?.label || s)}</h2><div class="big">${list.length}</div><p style="color:var(--dim)">${esc(info?.hint || '')}</p>
${byArea.length ? `<h3>By area</h3><div class="bars">${byArea.map((x) => `<div style="--c:${x.a.color}"><span>${esc(x.a.label)}</span><em style="width:${(x.n / max) * 200}px"></em>${x.n}</div>`).join('')}</div>` : ''}
${list.length ? `<h3>Ideas here</h3>${itemsHTML(list)}` : ''}`;
  }
  if (!h) return;
  if (!quiet || panelEl._key !== key) { const top = panelEl._key === key ? panelEl.scrollTop : 0; panelEl.innerHTML = `<button class="x" aria-label="Close">×</button>${h}`; panelEl.scrollTop = top; }
  else { const top = panelEl.scrollTop; panelEl.innerHTML = `<button class="x" aria-label="Close">×</button>${h}`; panelEl.scrollTop = top; }
  panelEl._key = key;
  panelEl.classList.add('open');
}
function closePanel() { panelEl.classList.remove('open'); panelEl._key = null; sel = null; render(); }

function rectOf(key) {
  if (key === 'fit') return L.bounds;
  if (key === 'sim') return { x: L.sim.x - 60, y: L.sim.y - 200, w: L.sim.w + 120, h: L.sim.h + 260 };
  if (key.startsWith('i:')) { const p = L.pos.get(key.slice(2)); return p && { x: p.x, y: p.y, w: TW, h: TH }; }
  if (key.startsWith('a:')) { const p = L.apos.get(key.slice(2)); return p && { x: p.x, y: p.y, w: AW, h: AH }; }
  if (key.startsWith('c:')) { const c = L.cols.find((c) => c.key === key.slice(2)); return c && { x: c.x, y: 0, w: c.w, h: Math.min(c.h, 2400) }; }
  if (key.startsWith('b:')) { for (const c of L.cols) for (const b of c.boxes || []) if (b.a.key === key.slice(2)) return b; }
}
function go(key) {
  if (key === 'fit') { sel = null; panelEl.classList.remove('open'); panelEl._key = null; render(); return fitAll(); }
  const r = rectOf(key);
  if (!r) return;
  if (key.startsWith('b:') || key === 'sim') { sel = null; panelEl.classList.remove('open'); panelEl._key = null; render(); return flyTo(r, 1.1); }
  sel = key;
  panel(key);
  render();
  flyTo(r, key.startsWith('c:') ? 0.8 : key.startsWith('a:') ? 1.25 : 1.6, key.startsWith('i:') ? 120 : 60);
}
panelEl.addEventListener('click', (e) => {
  if (e.target.closest('.x')) return closePanel();
  const g = e.target.closest('[data-go]');
  if (g) go(g.dataset.go);
});
document.getElementById('crumbs').addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });

// ---------- input ----------
const ptrs = new Map();
let drag = null, pinch = null;
stage.addEventListener('pointerdown', (e) => {
  fly++;
  try { stage.setPointerCapture(e.pointerId); } catch {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: 0, target: e.target };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k }; drag = null; }
  stage.classList.add('moving');
});
stage.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((pinch.k * d) / pinch.d / view.k, (a.x + b.x) / 2, (a.y + b.y) / 2);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
    if (drag.moved > 4) { stage.classList.add('drag'); view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
  }
});
const up = (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && drag.moved <= 4 && e.type === 'pointerup') clickAt(drag.target);
  if (!ptrs.size) { drag = null; stage.classList.remove('drag', 'moving'); }
};
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);
function clickAt(t) {
  const k = t.closest?.('[data-key]')?.dataset.key;
  if (!k || k === 'floor' || k.startsWith('ar:')) { if (sel) closePanel(); return; }
  if (k === 'sim') return go('sim');
  go(k);
}
stage.addEventListener('dblclick', (e) => { if (!e.target.closest('.tile,.agent')) zoomAt(2, e.clientX, e.clientY); });
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  fly++;
  const mouse = !e.ctrlKey && e.deltaX === 0 && Math.abs(e.deltaY) >= 40 && e.deltaMode === 0 && Number.isInteger(e.deltaY);
  if (e.ctrlKey || mouse || e.deltaMode === 1) zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : e.deltaMode === 1 ? 0.05 : 0.0018)), e.clientX, e.clientY);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive: false });
document.getElementById('zin').onclick = () => zoomAt(1.6, innerWidth / 2, innerHeight / 2);
document.getElementById('zout').onclick = () => zoomAt(1 / 1.6, innerWidth / 2, innerHeight / 2);
document.getElementById('zfit').onclick = () => go('fit');
document.querySelectorAll('#lod span').forEach((s) => s.addEventListener('click', () => {
  const k = [0.25, 0.6, 1.25][+s.dataset.l];
  zoomAt(k / view.k, innerWidth / 2, innerHeight / 2);
}));
document.querySelector('#mini').addEventListener('pointerdown', (e) => {
  const cv = document.querySelector('#mini canvas'), r = cv.getBoundingClientRect(), m = cv._m;
  const mx = ((e.clientX - r.left) / r.width) * cv.width, my = ((e.clientY - r.top) / r.height) * cv.height;
  const wx = (mx - m.ox) / m.s, wy = (my - m.oy) / m.s;
  view.x = innerWidth / 2 - wx * view.k; view.y = innerHeight / 2 - wy * view.k;
  apply();
});
const search = document.getElementById('search');
search.addEventListener('input', () => { query = search.value; render(); });
search.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = query.trim().toLowerCase();
    if (!q) return;
    const a = [...D.agents.values()].find((a) => a.name.toLowerCase().startsWith(q));
    if (a) return go('a:' + a.id);
    const hit = [...D.ideas.values()].find((it) => it.id.toLowerCase() === q) || [...D.ideas.values()].find((it) => it.id.toLowerCase().includes(q) || it.title.toLowerCase().includes(q) || (it.detail || '').toLowerCase().includes(q));
    if (hit) go('i:' + hit.id);
  }
  if (e.key === 'Escape') { search.value = ''; query = ''; search.blur(); render(); }
});
addEventListener('keydown', (e) => {
  if (e.target === search) return;
  if (e.key === '/') { e.preventDefault(); search.focus(); }
  else if (e.key === '0' || e.key === 'f') go('fit');
  else if (e.key === '+' || e.key === '=') zoomAt(1.6, innerWidth / 2, innerHeight / 2);
  else if (e.key === '-') zoomAt(1 / 1.6, innerWidth / 2, innerHeight / 2);
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') {
    if (sel?.startsWith('i:')) { const it = D.ideas.get(sel.slice(2)); go(it ? 'c:' + it.status : 'fit'); }
    else go('fit');
  }
});
addEventListener('resize', () => { apply(); timeline(cursor == null ? S.events : S.events.slice(0, cursor)); });

// ---------- replay ----------
let playT = null;
const playBtn = document.getElementById('play');
function togglePlay() {
  if (playT) { clearTimeout(playT); playT = null; playBtn.textContent = 'Resume'; return; }
  if (cursor == null || cursor >= S.events.length) cursor = 0;
  playBtn.textContent = 'Pause';
  const n = S.events.length, wait = Math.max(160, Math.min(900, 30000 / Math.max(1, n)));
  const step = () => {
    if (cursor >= S.events.length) { playT = null; cursor = null; playBtn.textContent = 'Replay the day'; render(); return; }
    cursor++;
    render([S.events[cursor - 1]]);
    playT = setTimeout(step, wait);
  };
  render();
  step();
}
playBtn.onclick = togglePlay;
document.getElementById('range').addEventListener('input', (e) => {
  if (playT) { clearTimeout(playT); playT = null; playBtn.textContent = 'Resume'; }
  const v = +e.target.value;
  cursor = v >= S.events.length ? null : v;
  if (cursor == null) playBtn.textContent = 'Replay the day';
  render();
});
document.getElementById('live').addEventListener('click', () => { if (SNAP) return; if (playT) clearTimeout(playT); playT = null; cursor = null; playBtn.textContent = 'Replay the day'; render(); });

// ---------- live ----------
function adopt(s) {
  S = s;
  AREA = new Map(S.areas.map((a) => [a.key, a]));
  AIDX = new Map(S.areas.map((a, i) => [a.key, i]));
}
async function poll() {
  try {
    const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
    const before = S.events.length;
    adopt(s);
    if (cursor == null) render(s.events.slice(before));
    else timeline(S.events.slice(0, cursor));
  } catch {}
  setTimeout(poll, 3000);
}
function simTick() {
  const img = document.querySelector('.sim img');
  if (img && lod > 0 && !document.hidden) {
    const r = img.getBoundingClientRect();
    if (r.right > 0 && r.left < innerWidth && r.bottom > 0 && r.top < innerHeight) img.src = `/api/sim.png?t=${Date.now()}`;
  }
  setTimeout(simTick, 4000);
}

(async function start() {
  adopt(SNAP || (await (await fetch('/api/state', { cache: 'no-store' })).json()));
  render();
  // Open from far away, then settle on the whole round.
  const b = L.bounds, k = Math.min(innerWidth / b.w, (innerHeight - 200) / b.h) * 0.92;
  view.k = k * 0.35; view.x = innerWidth / 2 - (b.x + b.w / 2) * view.k; view.y = innerHeight / 2 - (b.y + b.h / 2) * view.k;
  apply();
  frame(() => fitAll());
  setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 5500);
  addEventListener('pointerdown', () => { document.getElementById('hint').style.opacity = 0; }, { once: true });
  if (!SNAP) { setTimeout(poll, 3000); simTick(); }
})();
</script>
</body>
