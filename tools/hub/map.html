<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0B090D; --panel: #1B1520; --ink: #F5EBDD; --dim: #A3958A; --faint: #6E6259; --gold: #F5B45C; --z: 1; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Figtree, system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0; letter-spacing: -.01em; }
button { font: inherit; color: inherit; }

/* ---------- space ---------- */
#stage { position: fixed; inset: 0; cursor: grab; touch-action: none; overflow: hidden;
  background: radial-gradient(circle at 50% 50%, #1d1418 0%, #0f0b11 45%, var(--bg) 80%); }
#stars { position: absolute; inset: -50%; pointer-events: none; opacity: .7;
  background-image: radial-gradient(1px 1px at 20% 30%, #fff8, transparent), radial-gradient(1px 1px at 70% 80%, #fff6, transparent), radial-gradient(1.5px 1.5px at 40% 70%, #fff5, transparent), radial-gradient(1px 1px at 85% 15%, #fff7, transparent), radial-gradient(1px 1px at 10% 85%, #fff5, transparent), radial-gradient(1.2px 1.2px at 55% 45%, #fff4, transparent);
  background-size: 340px 340px, 470px 470px, 590px 590px, 310px 310px, 530px 530px, 650px 650px; }
#stage.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#stage.moving #world { will-change: transform; }
#orbits { position: absolute; left: 0; top: 0; overflow: visible; }
#orbits .ring { fill: none; stroke: var(--s); stroke-opacity: .28; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
#orbits .band { fill: none; stroke: var(--s); stroke-opacity: .05; }
#orbits .hitr { fill: none; stroke: transparent; stroke-width: 120; pointer-events: stroke; cursor: pointer; }
#orbits .hitr:hover + .ring, #orbits .ring.on { stroke-opacity: .85; stroke-width: 3; }
#orbits .spoke { stroke: #ffffff10; stroke-width: 1; vector-effect: non-scaling-stroke; }
#orbits .orbitp { fill: none; stroke: #ffffff18; stroke-width: 1; stroke-dasharray: 2 6; vector-effect: non-scaling-stroke; }
#orbits .wedge { fill: transparent; cursor: pointer; pointer-events: all; }
#orbits .wedge:hover { fill: #ffffff06; }

/* the sun: the app itself */
.sun { position: absolute; border-radius: 50%; cursor: pointer; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 40% 35%, #FFF1D6 0%, #FFD08A 25%, #F5B45C 50%, #C9702A 80%, #8a4316 100%);
  box-shadow: 0 0 120px 40px #F5B45C55, 0 0 400px 160px #F5B45C22; animation: sun 6s ease-in-out infinite; }
@keyframes sun { 50% { box-shadow: 0 0 160px 60px #F5B45C66, 0 0 520px 200px #F5B45C2a; } }
.sun .sn { font-family: Fraunces, serif; font-weight: 600; color: #3A1D08; font-size: calc(70px * min(var(--z), 2.4)); line-height: 1; }
.sun .ss { font-size: 30px; color: #5A3212; margin-top: 10px; font-weight: 600; }
#stage.l0 .sun .ss { display: none; }

/* ring and area labels */
.rl { position: absolute; transform: translate(-50%, -50%); padding: .2em .7em; border-radius: 99px; white-space: nowrap; cursor: pointer;
  background: color-mix(in srgb, var(--s) 22%, #120e14); border: 2px solid color-mix(in srgb, var(--s) 55%, transparent); color: var(--ink);
  font-size: calc(30px * min(var(--z), 6)); font-weight: 600; }
.rl b { color: var(--s); font-family: Fraunces, serif; margin-right: .35em; font-variant-numeric: tabular-nums; }
.rl:hover { background: color-mix(in srgb, var(--s) 40%, #120e14); }
.al { position: absolute; white-space: nowrap; font-family: Fraunces, serif; font-size: calc(44px * min(var(--z), 3)); color: var(--c); transform-origin: 0 50%; cursor: pointer; opacity: .9; }
.al small { font-family: Figtree, sans-serif; font-size: .5em; color: var(--dim); margin: 0 .5em; }
.al:hover { opacity: 1; text-decoration: underline; text-underline-offset: 6px; }

/* ideas: dots */
.dot { position: absolute; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: var(--c); cursor: pointer;
  box-shadow: 0 0 0 0 transparent, 0 0 18px color-mix(in srgb, var(--c) 50%, transparent);
  transition: transform 1.3s cubic-bezier(.25,.85,.25,1), opacity .5s, box-shadow .3s, width .3s, height .3s, margin .3s; }
.dot:hover { box-shadow: 0 0 0 8px #F5EBDDcc, 0 0 30px var(--c); z-index: 3; }
.dot .dl { position: absolute; left: 50%; top: 96px; width: 180px; margin-left: -90px; text-align: center; font-size: 22px; line-height: 1.15; color: var(--ink); pointer-events: none;
  display: none; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 6px #000; }
.dot .di { position: absolute; left: 50%; top: 94px; transform: translateX(-50%); font-size: 40px; font-weight: 700; color: var(--c); white-space: nowrap; pointer-events: none; display: none; text-shadow: 0 1px 6px #000; }
#stage.l1 .dot .di { display: block; }
#stage.l2 .dot .dl { display: -webkit-box; }
.dot.st-building { width: 112px; height: 112px; margin: -56px 0 0 -56px; animation: pulse 2s ease-in-out infinite; }
.dot.st-building .dl, .dot.st-building .di { top: 124px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 16px #F5B45C33, 0 0 50px #F5B45C; } }
.dot.st-checked, .dot.st-review, .dot.st-integrated { box-shadow: 0 0 0 5px #0B090D, 0 0 0 9px var(--s); }
.dot.st-verified, .dot.st-shipped { box-shadow: 0 0 0 5px #0B090D, 0 0 0 9px var(--s), 0 0 40px var(--s); }
.dot.st-blocked { box-shadow: 0 0 0 5px #0B090D, 0 0 0 10px #F07060; }
.dot.st-dropped { opacity: .3; }
.dot.sel { box-shadow: 0 0 0 8px #0B090D, 0 0 0 14px var(--ink), 0 0 60px var(--ink) !important; z-index: 4; }
.dot.born { animation: born 1.4s cubic-bezier(.2,.85,.2,1); }
@keyframes born { from { transform: scale(0); filter: brightness(4); } }
#stage.q .dot:not(.hit), #stage.f .dot:not(.fo) { opacity: .1; }
#stage.q .dot.hit { box-shadow: 0 0 0 8px #0B090D, 0 0 0 13px var(--ink); }

/* agents: planets */
.planet { position: absolute; left: 0; top: 0; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--ac) 30%, #fff), var(--ac) 40%, color-mix(in srgb, var(--ac) 35%, #000) 100%);
  box-shadow: 0 0 60px color-mix(in srgb, var(--ac) 50%, transparent), inset -30px -30px 60px #0006; transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
.planet .moon { position: absolute; left: 50%; top: 50%; width: 0; height: 0; animation: spin 9s linear infinite; pointer-events: none; }
.planet .moon::after { content: ''; position: absolute; left: 200px; top: -14px; width: 28px; height: 28px; border-radius: 50%; background: #E8DCCB; box-shadow: 0 0 12px #fff6; }
.planet:not(.on) .moon { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.planet.on::before { content: ''; position: absolute; inset: -40px; border-radius: 50%; border: 4px solid var(--ac); opacity: .5; animation: halo 2.2s ease-out infinite; }
@keyframes halo { from { transform: scale(.85); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
.planet.sel { box-shadow: 0 0 0 14px #0B090D, 0 0 0 22px var(--ink), 0 0 80px var(--ac); }
.planet .pn { position: absolute; left: 50%; top: calc(100% + 24px); transform: translateX(-50%); white-space: nowrap; font-family: Fraunces, serif; font-weight: 600; font-size: calc(56px * min(var(--z), 4.5)); color: var(--ink); text-shadow: 0 2px 12px #000; pointer-events: none; }
.planet .pi { position: absolute; left: 50%; top: calc(100% + 100px); transform: translateX(-50%); width: 520px; padding: 22px 26px; border-radius: 28px; background: #1B1520e6; border: 2px solid color-mix(in srgb, var(--ac) 45%, transparent); display: none; pointer-events: none; }
#stage.l1 .planet .pi, #stage.l2 .planet .pi { display: block; }
.pi .am { font-size: 18px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
.pi .as { margin-top: 10px; font-size: 22px; font-weight: 600; color: var(--dim); display: flex; align-items: center; gap: 10px; }
.pi .as::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--faint); }
.planet.on .pi .as { color: var(--ink); }
.planet.on .pi .as::before { background: #8CE0A8; box-shadow: 0 0 12px #8CE0A8; }
.pi .ac { margin-top: 6px; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pi .pbar { margin-top: 10px; height: 8px; border-radius: 9px; background: #ffffff14; overflow: hidden; }
.pi .pbar i { display: block; height: 100%; background: var(--ac); }
.pi .wf { display: none; margin-top: 12px; gap: 6px; flex-wrap: wrap; }
.pi .wf span { font-size: 14px; padding: 3px 10px; border-radius: 99px; background: #ffffff0c; color: var(--faint); }
.pi .wf span.past { color: var(--dim); }
.pi .wf span.now { background: var(--ac); color: #1B1520; font-weight: 700; }
.pi .recent { display: none; margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--dim); }
.pi .recent li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }
.pi .recent time { color: var(--faint); margin-right: 8px; }
#stage.l2 .pi .wf { display: flex; }
#stage.l2 .pi .recent { display: block; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 99px; background: #ffffff14; color: var(--ink); font-size: 12.5px; font-weight: 600; }
.ring-pulse { position: absolute; border-radius: 50%; border: 8px solid var(--ac); pointer-events: none; animation: rp 1.4s ease-out forwards; }
@keyframes rp { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.8); } }

#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: 4 7; animation: dash 1.2s linear infinite; opacity: .6; }
#links path.cur { stroke-width: 3; opacity: .95; }
#links path.q { opacity: .25; }
@keyframes dash { to { stroke-dashoffset: -22; } }
.comet { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; offset-rotate: 0deg; animation: fly 1.6s cubic-bezier(.5,0,.3,1) forwards; }
@keyframes fly { from { offset-distance: 0%; opacity: 1; } 85% { opacity: 1; } to { offset-distance: 100%; opacity: 0; } }

/* ---------- HUD ---------- */
.hud { position: fixed; z-index: 10; }
.glass { background: #1B1520d9; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid #ffffff14; border-radius: 18px; box-shadow: 0 10px 40px #0008; }
#top { left: 16px; top: 16px; right: 16px; display: flex; gap: 12px; align-items: center; pointer-events: none; }
#top > * { pointer-events: auto; }
#brand { padding: 10px 16px; display: flex; flex-direction: column; }
#brand h1 { font-size: 20px; line-height: 1.1; }
#brand .crumbs { font-size: 13px; color: var(--dim); margin-top: 2px; white-space: nowrap; }
#brand .crumbs b { color: var(--ink); font-weight: 600; }
.go { cursor: pointer; }
.crumbs .go:hover { color: var(--ink); }
#kpis { display: flex; gap: 6px; padding: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.kpi { padding: 6px 12px; border-radius: 12px; background: #ffffff08; display: flex; flex-direction: column; min-width: 70px; }
.kpi b { font-family: Fraunces, serif; font-size: 22px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.kpi.warn b { color: #F0845A; }
#search { width: 210px; padding: 10px 14px; border-radius: 14px; border: 1px solid #ffffff1a; background: #1B1520d9; color: var(--ink); font: inherit; outline: none; }
#search:focus { border-color: var(--gold); }
.lnk { padding: 10px 14px; text-decoration: none; color: var(--dim); font-size: 13px; white-space: nowrap; }
.lnk:hover { color: var(--ink); }

/* the dock: every place in the system, one tap away */
#dock { left: 16px; top: 92px; bottom: 112px; width: 210px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
#dock h3 { font-family: Figtree, sans-serif; font-size: 11.5px; font-weight: 700; color: var(--faint); margin: 10px 8px 4px; }
#dock h3:first-child { margin-top: 2px; }
#dock button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; text-align: left; font-size: 13.5px; color: var(--ink); }
#dock button:hover { background: #ffffff10; }
#dock button.on { background: #ffffff18; }
#dock button i { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--s); }
#dock button i.pl { width: 14px; height: 14px; background: radial-gradient(circle at 35% 30%, #fff8, var(--s) 50%); box-shadow: 0 0 8px var(--s); }
#dock button i.sunb { width: 14px; height: 14px; background: radial-gradient(circle at 35% 30%, #FFF1D6, #F5B45C); box-shadow: 0 0 10px #F5B45C; }
#dock button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#dock button em { font-style: normal; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
#dock button.live span::after { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #8CE0A8; box-shadow: 0 0 8px #8CE0A8; margin-left: 6px; vertical-align: middle; }

#zoom { left: 240px; bottom: 112px; display: flex; flex-direction: column; padding: 4px; gap: 2px; }
#zoom button { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 12px; font-size: 20px; cursor: pointer; }
#zoom button:hover { background: #ffffff12; }
#lod { left: 290px; bottom: 118px; padding: 8px 12px; font-size: 12.5px; color: var(--dim); display: flex; gap: 10px; }
#lod span { cursor: pointer; }
#lod span.on { color: var(--gold); font-weight: 700; }

#bottom { left: 16px; right: 16px; bottom: 16px; padding: 12px 16px; display: flex; gap: 14px; align-items: center; }
#play { flex: none; height: 44px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--gold); color: #1B1520; font-weight: 700; cursor: pointer; white-space: nowrap; }
#tl { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#tlrow { display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--dim); min-width: 0; }
#tlrow b { color: var(--ink); white-space: nowrap; }
#tlmsg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#live { margin-left: auto; white-space: nowrap; display: flex; gap: 6px; align-items: center; cursor: pointer; }
#live::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
#live.on { color: #8CE0A8; }
#live.on::before { background: #8CE0A8; box-shadow: 0 0 10px #8CE0A8; }
#scrub { position: relative; height: 26px; }
#scrub canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#scrub input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }

#mini { right: 16px; bottom: 112px; padding: 6px; cursor: crosshair; border-radius: 50%; }
#mini canvas { display: block; width: 170px; height: 170px; border-radius: 50%; }

#panel { right: 16px; top: 84px; bottom: 112px; width: 400px; padding: 22px; overflow-y: auto; transform: translateX(440px); opacity: 0; transition: transform .45s cubic-bezier(.2,.85,.2,1), opacity .3s; }
#panel.open { transform: none; opacity: 1; }
#panel .x { position: sticky; top: 0; float: right; width: 34px; height: 34px; border-radius: 10px; border: 0; background: #ffffff12; cursor: pointer; font-size: 18px; }
#panel h2 { font-size: 28px; line-height: 1.12; margin: 4px 0 10px; }
#panel .eyebrow { font-size: 13px; color: var(--dim); }
#panel .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
#panel p { color: #E2D6C6; line-height: 1.5; margin: 10px 0; }
#panel h3 { font-family: Figtree, sans-serif; font-size: 13px; font-weight: 700; color: var(--dim); margin: 22px 0 8px; }
#panel .hist { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid #ffffff14; }
#panel .hist li { position: relative; padding: 0 0 14px 6px; font-size: 14px; line-height: 1.4; }
#panel .hist li::before { content: ''; position: absolute; left: -23px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--ac, var(--faint)); }
#panel .hist .when { font-size: 12px; color: var(--faint); display: block; }
#panel .hist .who { font-weight: 700; color: var(--ac); }
#panel .shot { width: 100%; border-radius: 14px; margin: 6px 0; border: 1px solid #ffffff14; }
#panel .simshot { width: 62%; display: block; margin: 8px auto; border-radius: 26px; border: 8px solid #2a2330; }
#panel .items { list-style: none; margin: 0; padding: 0; }
#panel .items li { padding: 8px 10px; border-radius: 10px; font-size: 14px; display: flex; gap: 10px; cursor: pointer; }
#panel .items li:hover { background: #ffffff0c; }
#panel .items li i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; margin-top: 4px; }
#panel .items li em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--s); white-space: nowrap; }
#panel .bars { display: flex; flex-direction: column; gap: 5px; }
#panel .bars div { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
#panel .bars span { width: 120px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel .bars em { height: 10px; border-radius: 5px; background: var(--c); }
#panel .wfp { display: flex; gap: 6px; flex-wrap: wrap; }
#panel .wfp span { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: #ffffff0c; color: var(--dim); }
#panel .wfp span.now { background: var(--ac); color: #1B1520; font-weight: 700; }
#panel .big { font-family: Fraunces, serif; font-size: 40px; line-height: 1; }
#panel .pb { height: 8px; border-radius: 9px; background: #ffffff12; overflow: hidden; margin: 8px 0; }
#panel .pb i { display: block; height: 100%; background: var(--gold); }
.own { padding: 1px 9px; border-radius: 99px; background: color-mix(in srgb, var(--oc) 22%, transparent); color: var(--oc); font-weight: 600; font-size: 12.5px; }

#tip { position: fixed; z-index: 20; pointer-events: none; max-width: 300px; padding: 10px 14px; font-size: 13px; line-height: 1.35; opacity: 0; transition: opacity .15s; }
#tip.on { opacity: 1; }
#tip b { display: block; font-size: 15px; margin: 2px 0; }
#tip .m { color: var(--dim); }
#tick { left: 240px; top: 92px; width: 340px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#tick div { padding: 8px 12px; font-size: 13px; line-height: 1.35; border-left: 4px solid var(--ac); animation: tin .5s cubic-bezier(.2,.85,.2,1); }
#tick div b { color: var(--ac); }
@keyframes tin { from { opacity: 0; transform: translateY(-10px); } }
#hint { left: 50%; bottom: 120px; transform: translateX(-50%); padding: 14px 22px; text-align: center; font-size: 14px; color: var(--dim); transition: opacity .8s; pointer-events: none; }
#hint b { color: var(--ink); font-family: Fraunces, serif; font-size: 20px; display: block; margin-bottom: 4px; font-weight: 600; }

/* ---------- Today card: usage, merge queue, this wave ---------- */
#today { right: 16px; top: 84px; width: 300px; max-height: calc(100vh - 396px); overflow-y: auto; padding: 12px 14px 14px; transition: right .45s cubic-bezier(.2,.85,.2,1); }
#panel.open ~ #today { right: 432px; }
#today.min { overflow: hidden; padding-bottom: 12px; }
#today.min .tbody { display: none; }
#today .thead { display: flex; align-items: center; gap: 8px; }
#today .thead h2 { font-size: 18px; line-height: 1.1; flex: 1; }
#today .thead small { font-size: 11.5px; color: var(--faint); }
#today .tx { width: 28px; height: 28px; border-radius: 9px; border: 0; background: #ffffff12; cursor: pointer; font-size: 16px; line-height: 1; color: var(--dim); }
#today .tx:hover { background: #ffffff1e; color: var(--ink); }
#today h3 { font-family: Figtree, sans-serif; font-size: 11.5px; font-weight: 700; color: var(--faint); margin: 14px 0 6px; }
#today .meter { margin: 0 0 8px; }
#today .meter div { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dim); }
#today .meter b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
#today .meter i { display: block; height: 5px; border-radius: 99px; background: #ffffff14; margin-top: 4px; overflow: hidden; }
#today .meter i u { display: block; height: 100%; border-radius: 99px; background: var(--mc); transition: width .6s cubic-bezier(.2,.85,.2,1), background .3s; }
#today .note { font-size: 12px; color: var(--faint); margin: 4px 0 0; line-height: 1.4; }
#today .prs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
#today .prs li { font-size: 12.5px; line-height: 1.3; }
#today .prs .pt { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
#today .prs .pt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#today .prs .pt b { color: var(--dim); font-weight: 600; flex: none; font-variant-numeric: tabular-nums; }
#today .prs .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }

  </div>
</div>
<div id="hint" class="hud glass"><b>Every idea is a dot. The app is the sun.</b>Ideas fall inward, ring by ring, as they get built. Scroll to zoom, drag to move, tap anything.</div>

<script>
const STAGES = ['backlog', 'queued', 'building', 'checked', 'review', 'integrated', 'verified', 'shipped'];
const STAGE_COLOR = { backlog: '#7E7266', queued: '#C3B3A0', building: '#F5B45C', checked: '#B9D98A', review: '#AFA2DE', integrated: '#7FB8F0', verified: '#8CC0A8', shipped: '#FFDCA6', blocked: '#F07060', dropped: '#5d5249' };
const SNAP = window.__SNAPSHOT__ || null;
let NOW = Date.now();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function ago(t, now = NOW) {
  const s = Math.max(0, Math.round((now - new Date(t).getTime()) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m ago`;
}
const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

// ---------- fold events into state (same as the classic view) ----------
function derive(s) {
  const agents = new Map(s.team.agents.map((a) => [a.id, { ...a, events: [], files: new Set(), claimed: new Set(), handed: new Set(), checksOk: 0, checksFail: 0, last: null, cur: null, pct: 0, step: -1, filed: 0 }]));
  const ideas = new Map();
  for (const i of s.ideas) {
    const status = i.status === 'verified' ? 'verified' : i.status === 'dropped' ? 'dropped' : i.status === 'shipped' ? 'shipped' : i.owner && i.owner !== 'atlas' ? 'queued' : i.owner === 'atlas' ? 'queued' : 'backlog';
    ideas.set(i.id, { ...i, status, history: [], pct: 0, by: null });
  }
  let n = 0;
  for (const e of s.events) {
    const a = agents.get(e.agent);
    if (e.type === 'idea' && e.title) {
      n++;
      let id = e.id || `S${String(n).padStart(3, '0')}`;
      while (ideas.has(id)) id += "'";
      ideas.set(id, { id, area: e.area || 'craft', size: e.size || 'M', impact: e.impact || 2, owner: null, title: e.title, detail: e.msg, tags: (e.tags || '').split(/\s+/).filter(Boolean), status: 'backlog', history: [e], pct: 0, by: e.agent, fresh: e.t });
      if (a) a.filed++;
    }
    if (a) {
      a.events.push(e);
      a.last = e;
      (e.files || []).forEach((f) => a.files.add(f));
      if (e.type === 'check') e.ok ? a.checksOk++ : a.checksFail++;
      if (e.branch || e.path) a.tree = { branch: e.branch || a.tree?.branch, path: e.path || a.tree?.path };
      const st = stepOf(a, e);
      if (st >= 0) a.step = st;
    }
    const ids = [...(e.ideas || [])];
    if (e.type === 'check' && e.ok && !ids.length && a) ids.push(...[...a.claimed].filter((id) => ideas.get(id)?.status === 'building'));
    for (const id of ids) {
      const it = ideas.get(id);
      if (!it) continue;
      it.history.push(e);
      const to = { queue: 'queued', claim: 'building', commit: 'review', done: 'review', integrated: 'integrated', verified: 'verified', shipped: 'shipped', blocked: 'blocked', dropped: 'dropped' }[e.type];
      if (e.type === 'queue') it.owner = e.to === 'none' ? null : e.to || it.owner;
      if (e.type === 'claim') { it.owner = e.agent; a?.claimed.add(id); if (a) a.cur = id; }
      if (e.type === 'step') { if (['backlog', 'queued'].includes(it.status)) it.status = 'building'; if (e.pct != null) it.pct = e.pct; if (a) { a.cur = id; a.claimed.add(id); } }
      if (e.type === 'check' && e.ok && ['building', 'queued', 'backlog'].includes(it.status)) it.status = 'checked';
      if (to) it.status = e.type === 'queue' && e.to === 'none' ? 'backlog' : to;
      if (e.type === 'done' || e.type === 'commit') { it.pct = 100; a?.handed.add(id); if (a && a.cur === id) a.cur = null; }

}

function stepOf(a, e) {
  const wf = a.workflow.map((w) => w.toLowerCase());
  const find = (...names) => { for (const n of names) { const i = wf.indexOf(n); if (i >= 0) return i; } return -1; };
  const byState = { reading: find('read', 'read pages', 'sweep', 'plan'), building: find('build', 'fix safe', 'ground in code', 'merge'), checking: find('gate', 'verify live') };
  if (e.state && byState[e.state] >= 0) return byState[e.state];
  const byType = {
    hello: find('read', 'read pages', 'sweep', 'plan'), claim: find('claim', 'fix safe'), step: find('build', 'fix safe', 'ground in code'), file: find('build', 'fix safe', 'ground in code'),
    check: find('gate'), commit: find('commit'), done: find('hand off', 'report', 'file ideas'), bye: find('hand off', 'report', 'file ideas', 'ship'),
    note: find('imagine', 'triage', 'plan'), idea: find('file ideas', 'triage'), queue: find('assign'), integrated: find('merge'), verified: find('verify live'), shot: find('verify live'), shipped: find('ship'),
  };
  return byType[e.type] ?? -1;
}

function agentState(a, now) {
  const e = a.last;
  if (!e) return { label: 'Waiting to start', active: false };
  const age = (now - new Date(e.t).getTime()) / 1000;
  if (e.type === 'bye') return { label: 'Done for the wave', active: false };
  if (e.type === 'blocked') return { label: 'Blocked', active: true };
  const word = e.state ? { reading: 'Reading', building: 'Building', checking: 'Checking', waiting: 'Waiting', done: 'Done', idle: 'Idle' }[e.state] || e.state
    : { hello: 'Starting', claim: 'Building', step: 'Building', file: 'Writing', check: 'Checking', commit: 'Committing', done: 'Handed off', note: 'Thinking', idea: 'Filing ideas', queue: 'Assigning', integrated: 'Merging', verified: 'Verifying', shot: 'Verifying', shipped: 'Shipping', usage: 'Checking usage' }[e.type] || e.type;
  return { label: age > 600 ? `${word} (quiet ${Math.floor(age / 60)}m)` : word, active: age < 240 };
}


// ---------- the solar system: where everything lives ----------
// The app is the sun. Each stage is an orbit; ideas fall inward as they're built.
// Every area of the app owns a slice of the sky, the same slice on every ring.
const SUN = 380, SP = 150, LS = 170, DOT = 84, GAP = (26 * Math.PI) / 180, ORBIT = 4950;
const RING = { shipped: 650, verified: 950, integrated: 1250, review: 1530, checked: 1810, building: 2110, queued: 2450, backlog: 2850 };
const RINGS = ['shipped', 'verified', 'integrated', 'review', 'checked', 'building', 'queued', 'backlog'];
let S = null, D = null, L = null, AREA = new Map();
let cursor = null; // null = live, else how many events are shown
let sel = null; // 'i:ID' | 'a:ID' | 'c:stage' | 'b:area' | 'sun'
let query = '';
const keyOf = (i) => (AREA.has(i.area) ? i.area : 'other');

function layout(D) {
  const ideas = [...D.ideas.values()];
  const areas = [...S.areas];
  if (ideas.some((i) => !AREA.has(i.area))) areas.push({ key: 'other', label: 'Other', color: '#7E7266' });
  const cnt = new Map(areas.map((a) => [a.key, 0]));
  ideas.forEach((i) => cnt.set(keyOf(i), cnt.get(keyOf(i)) + 1));
  const used = areas.filter((a) => cnt.get(a.key) > 0);
  const tot = used.reduce((s, a) => s + Math.sqrt(cnt.get(a.key)), 0) || 1;
  const wedges = new Map();
  let a0 = -Math.PI / 2 + GAP / 2;
  for (const a of used) {
    const w = ((2 * Math.PI - GAP) * Math.sqrt(cnt.get(a.key))) / tot;
    wedges.set(a.key, { a0, a1: a0 + w, mid: a0 + w / 2, area: a, n: cnt.get(a.key) });
    a0 += w;
  }

  const pos = new Map();
  let outer = RING.backlog;
  const place = (items, R, w, outward, maxLanes) => {
    const width = (w.a1 - w.a0) * 0.88;
    let cap = Math.max(1, Math.floor((width * R) / SP));
    let lanes = Math.ceil(items.length / cap);
    if (lanes > maxLanes) { lanes = maxLanes; cap = Math.ceil(items.length / lanes); }
    const laneR = (l) => (outward ? R + l * LS : R + [0, LS * 0.62, -LS * 0.62][l]);
    let idx = 0;
    for (let l = 0; l < lanes; l++) {
      // Never closer than SP: a crowded slice spills a little past its edges instead.
      const m = Math.min(cap, items.length - idx), r = laneR(l), step = outward ? Math.min(SP / r, width / Math.max(1, m)) : SP / r;
      if (outward) outer = Math.max(outer, r);
      // Keep the gap at the top clear: that's where the orbit names live.
      const lo = -Math.PI / 2 + GAP / 2 + step / 2, hi = (3 * Math.PI) / 2 - GAP / 2 - step / 2;
      let start = w.mid - ((m - 1) / 2) * step;
      start = Math.min(Math.max(start, lo), hi - (m - 1) * step);
      for (let j = 0; j < m; j++, idx++) {
        const ang = start + j * step;
        pos.set(items[idx].id, { x: Math.cos(ang) * r, y: Math.sin(ang) * r });
      }
    }
  };
  const sorter = (a, b) => (b.impact || 0) - (a.impact || 0) || a.id.localeCompare(b.id);
  // Inner orbits are sparse: one lane each, every dot near its area's slice,
  // nudged along the ring until no two touch.
  const lo = -Math.PI / 2 + GAP / 2, hi = (3 * Math.PI) / 2 - GAP / 2;
  const spread = (list, r) => {
    const sep = SP / r, want = [];
    for (const [k, w] of wedges) {
      const items = list.filter((i) => keyOf(i) === k).sort(sorter);
      items.forEach((it, j) => want.push({ it, a: w.mid + (j - (items.length - 1) / 2) * sep }));
    }
    want.sort((p, q) => p.a - q.a);
    for (let n = 0; n < 120; n++) {
      for (let i = 0; i < want.length - 1; i++) {
        const d = want[i + 1].a - want[i].a;
        if (d < sep) { const push = (sep - d) / 2; want[i].a -= push; want[i + 1].a += push; }

      for (const w of want) w.a = Math.min(hi - sep / 2, Math.max(lo + sep / 2, w.a));

  };
  for (const rk of RINGS) {
    const list = ideas.filter((i) => i.status === rk || (rk === 'building' && i.status === 'blocked'));
    if (!list.length) continue;
    if (rk === 'backlog') {
      for (const [k, w] of wedges) { const items = list.filter((i) => keyOf(i) === k).sort(sorter); if (items.length) place(items, RING[rk], w, true, 7); }
      continue;
    }
    const R = RING[rk], fit = Math.floor(((hi - lo) * R) / SP);

  }

  const dropR = labelR + 330;
  const dropped = ideas.filter((i) => i.status === 'dropped');
  for (const [k, w] of wedges) { const items = dropped.filter((i) => keyOf(i) === k).sort(sorter); if (items.length) place(items, dropR, w, true, 2); }

  // Planets sit over the slice of sky they work in, pushed apart so none overlap.
  const ag = [...D.agents.values()];
  const pl = ag.map((a, i) => {
    const c = new Map();
    ideas.forEach((it) => { if (it.owner === a.id || a.claimed.has(it.id) || a.handed.has(it.id)) c.set(keyOf(it), (c.get(keyOf(it)) || 0) + 1); });
    let best = null, bn = 0;
    c.forEach((n, k) => { if (n > bn) { bn = n; best = k; } });
    return { a, ang: best && wedges.has(best) && a.id !== 'atlas' ? wedges.get(best).mid : -Math.PI / 2 + (i * 2 * Math.PI) / ag.length };
  });
  const minSep = 1250 / ORBIT;
  for (let it = 0; it < 80; it++) {
    pl.sort((p, q) => p.ang - q.ang);
    for (let i = 0; i < pl.length; i++) {
      const p = pl[i], q = pl[(i + 1) % pl.length];
      let d = q.ang - p.ang;
      if (i === pl.length - 1) d += 2 * Math.PI;
      if (d < minSep) { const push = (minSep - d) / 2; p.ang -= push; q.ang += push; }
    }
  }
  const apos = new Map(pl.map((p) => [p.a.id, { x: Math.cos(p.ang) * ORBIT, y: Math.sin(p.ang) * ORBIT, ang: p.ang }]));
  const BR = ORBIT + 650;
  return { pos, wedges, apos, labelR, dropR, outer, bounds: { x: -BR, y: -BR, w: BR * 2, h: BR * 2 }, BR };
}

// ---------- the camera ----------
const stage = document.getElementById('stage'), world = document.getElementById('world');
const orbitsSvg = document.getElementById('orbits'), linksSvg = document.getElementById('links'), starsEl = document.getElementById('stars');
const view = { x: 0, y: 0, k: 0.06 };
const minK = () => (L ? Math.min(innerWidth, innerHeight) / L.bounds.w * 0.5 : 0.02);
const lodOf = (k) => (k < 0.22 ? 0 : k < 0.6 ? 1 : 2);
let lod = -1;
function apply() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  starsEl.style.transform = `translate(${(view.x * 0.04) % 340}px, ${(view.y * 0.04) % 340}px)`;
  stage.style.setProperty('--z', Math.min(8, Math.max(1, 0.32 / view.k)).toFixed(3));
  const l = lodOf(view.k);
  if (l !== lod) {
    lod = l;
    stage.classList.remove('l0', 'l1', 'l2');
    stage.classList.add('l' + l);
    document.querySelectorAll('#lod span').forEach((s) => s.classList.toggle('on', +s.dataset.l === l));
  }
  crumbsSoon();
  miniSoon();
}
function zoomAt(f, cx, cy) {
  const k = Math.min(3, Math.max(minK(), view.k * f));
  const wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view.k = k; view.x = cx - wx * k; view.y = cy - wy * k;
  apply();
}
let fly = 0;
// requestAnimationFrame, with a timer behind it for when the page isn't painting.
function frame(fn) { let done = false; const run = () => { if (done) return; done = true; cancelAnimationFrame(r); clearTimeout(t); fn(performance.now()); }; const r = requestAnimationFrame(run); const t = setTimeout(run, 40); }
function viewport() {
  const open = document.getElementById('panel').classList.contains('open'), narrow = innerWidth <= 900;
  const left = narrow ? 0 : 240, right = open && !narrow ? 430 : 0;
  const top = 84, bottom = open && narrow ? innerHeight * 0.55 + 20 : 110;
  return { x: left, y: top, w: innerWidth - left - right, h: innerHeight - top - bottom };
}
function flyTo(r, maxK = 1.3, padPx = 40) {
  const v = viewport();
  const k = Math.min(maxK, (v.w - padPx * 2) / r.w, (v.h - padPx * 2) / r.h);
  const mx = v.x + v.w / 2, my = v.y + v.h / 2;
  const to = { k, cx: r.x + r.w / 2, cy: r.y + r.h / 2 };
  const from = { k: view.k, cx: (mx - view.x) / view.k, cy: (my - view.y) / view.k };
  const t0 = performance.now(), dur = 1000, id = ++fly;
  stage.classList.add('moving');
  const step = (t) => {
    if (id !== fly) return;
    const p = Math.min(1, (t - t0) / dur), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    // Pull back a little on long trips, then dive in: easier to keep your bearings.
    const dist = Math.hypot(to.cx - from.cx, to.cy - from.cy) * Math.min(from.k, to.k);
    const lift = Math.min(1.4, dist / innerWidth) * Math.sin(Math.PI * e);
    const kk = Math.exp(Math.log(from.k) + (Math.log(to.k) - Math.log(from.k)) * e - lift);

}
const fitAll = () => flyTo(L.bounds, 3, 10);

// ---------- drawing ----------
const els = new Map();
let gen = 0;
function el(key, cls) {
  let e = els.get(key);
  const born = !e;
  if (born) { e = document.createElement('div'); e.dataset.key = key; world.appendChild(e); els.set(key, e); }
  e._gen = gen; e._born = born;
  if (e._cls !== cls) { e.className = cls; e._cls = cls; }
  return e;
}
function place(e, x, y) {
  const tr = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
  if (e._born) { e.style.transition = 'none'; e.style.transform = tr; e.offsetWidth; e.style.transition = ''; }
  else if (e.style.transform !== tr) e.style.transform = tr;
}
const STAGE_INFO = () => Object.fromEntries([...S.team.pipeline.map((p) => [p.key, p]), ['blocked', { label: 'Blocked', hint: 'Waiting on something outside the team' }], ['dropped', { label: 'Dropped', hint: 'Drifted out of orbit: decided against, with a reason' }]]);
const ringOf = (s) => (s === 'blocked' ? 'building' : s);

function planetHTML(a, st) {
  const cur = a.cur && D.ideas.get(a.cur);
  return `<div class="moon"></div><div class="pn">${esc(a.name)}</div>
<div class="pi"><div class="am"><span class="chip">${esc(a.model)}</span><span>${esc(a.role)}</span></div>
<div class="as">${esc(st.label)}</div>
${cur ? `<div class="ac">On ${esc(cur.id)}: ${esc(cur.title)}</div><div class="pbar"><i style="width:${Math.max(4, a.pct || 0)}%"></i></div>` : `<div class="ac" style="color:var(--faint)">${a.handed.size ? `Handed off ${a.handed.size}` : a.filed ? `Filed ${a.filed} ideas` : 'No idea claimed'}</div>`}
<div class="wf">${a.workflow.map((w, i) => `<span class="${i === a.step ? 'now' : i < a.step ? 'past' : ''}">${esc(w)}</span>`).join('')}</div>
<ul class="recent">${a.events.slice(-3).reverse().map((e) => `<li><time>${ago(e.t)}</time>${esc(e.msg || e.type)}</li>`).join('')}</ul></div>`;
}

function drawOrbits() {
  const info = STAGE_INFO(), out = [];
  const R2 = L.labelR - 120;
  for (const [k, w] of L.wedges) {
    const p = (a, r) => `${(Math.cos(a) * r).toFixed(1)},${(Math.sin(a) * r).toFixed(1)}`;
    const large = w.a1 - w.a0 > Math.PI ? 1 : 0;
    out.push(`<path class="wedge" data-key="b:${k}" d="M${p(w.a0, SUN + 60)} L${p(w.a0, R2)} A${R2},${R2} 0 ${large} 1 ${p(w.a1, R2)} L${p(w.a1, SUN + 60)} A${SUN + 60},${SUN + 60} 0 ${large} 0 ${p(w.a0, SUN + 60)}Z"/>`);
    out.push(`<line class="spoke" x1="${(Math.cos(w.a0) * (SUN + 80)).toFixed(1)}" y1="${(Math.sin(w.a0) * (SUN + 80)).toFixed(1)}" x2="${(Math.cos(w.a0) * R2).toFixed(1)}" y2="${(Math.sin(w.a0) * R2).toFixed(1)}"/>`);

    out.push(`<circle class="hitr" data-key="c:${rk}" r="${R}"/><circle class="ring${sel === 'c:' + rk ? ' on' : ''}" style="--s:${STAGE_COLOR[rk]}" r="${R}"/>`);

}

function render(fresh = []) {

}

const curve = (ax, ay, tx, ty) => { const mx = (ax + tx) / 2 * 0.78, my = (ay + ty) / 2 * 0.78; return `M${ax.toFixed(0)},${ay.toFixed(0)} Q${mx.toFixed(0)},${my.toFixed(0)} ${tx.toFixed(0)},${ty.toFixed(0)}`; };
function drawLinks() {

// A comet flies from the planet to each idea an event touched.

// where the middle of the screen is, as a trail
let crumbT = 0;
function crumbsSoon() { if (!crumbT) { crumbT = 1; frame(() => { crumbT = 0; crumbs(); }); } }
function whereIs(x, y) {
  const r = Math.hypot(x, y);
  let ang = Math.atan2(y, x);
  let area = null;
  for (const [k, w] of L.wedges) { let a = ang; while (a < w.a0) a += 2 * Math.PI; if (a <= w.a1) { area = w.area; break; } }
  let ring = null;
  if (r < SUN) ring = 'sun';
  else if (r > ORBIT - 400) ring = 'planets';
  else if (r >= RING.backlog - 140 && r <= L.outer + 140) ring = 'backlog';
  else if (Math.abs(r - L.dropR) < 160) ring = 'dropped';
  else { let best = 1e9; for (const rk of RINGS) { const d = Math.abs(r - RING[rk]); if (d < best) { best = d; ring = rk; } } }
  return { ring, area };
}
function crumbs() {
  if (!L) return;

  const cx = (v.x + v.w / 2 - view.x) / view.k, cy = (v.y + v.h / 2 - view.y) / view.k;
  const parts = [`<span class="go" data-go="fit">${esc(S.team.round)}</span>`];
  if (lod > 0) {
    const w = whereIs(cx, cy);
    if (w.ring === 'sun') parts.push('<span class="go" data-go="sun">The app</span>');
    else if (w.ring === 'planets') parts.push('The planets');
    else {
      parts.push(`<span class="go" data-go="c:${w.ring}">${esc(STAGE_INFO()[w.ring]?.label || w.ring)}</span>`);
      if (w.area) parts.push(`<span class="go" data-go="b:${w.area.key}">${esc(w.area.label)}</span>`);
    }
  } else parts.push('The whole system');
  if (sel?.startsWith('i:')) parts.push(`<b>${esc(sel.slice(2))}</b>`);
  if (sel?.startsWith('a:')) parts.push(`<b>${esc(D.agents.get(sel.slice(2))?.name)}</b>`);

function miniSoon() { if (!miniT) { miniT = 1; frame(() => { miniT = 0; mini(); }); } }
function mini() {

  const s = W / 2 / L.BR, o = W / 2;

  g.fillStyle = '#F5B45C'; g.beginPath(); g.arc(o, o, SUN * s, 0, Math.PI * 2); g.fill();

}

<div class="row"><span class="chip go" data-go="c:${ringOf(it.status)}" style="background:${STAGE_COLOR[it.status]};color:#1B1520">${esc(si?.label || it.status)}</span><span class="chip">Size ${esc(it.size || 'M')}</span><span class="chip">Impact ${'●'.repeat(it.impact || 0)}</span>${o ? `<span class="own go" data-go="a:${o.id}" style="--oc:${o.color}">${esc(o.name)}</span>` : ''}${it.by ? `<span class="chip">Filed by ${esc(D.agents.get(it.by)?.name || it.by)}</span>` : ''}</div>
${it.detail ? `<p>${esc(it.detail)}</p>` : ''}
${it.status === 'building' || it.pct ? `<div class="pb"><i style="width:${it.pct || 4}%"></i></div>` : ''}
<h3>Where it is</h3><p style="margin:0;color:var(--dim)">${esc(si?.hint || '')}</p>
<h3>Its story</h3>${it.history.length ? histHTML(it.history) : '<p style="color:var(--dim)">Nothing has happened to this one yet. It waits in the idea bank for a wave.</p>'}`;
  } else if (key.startsWith('a:')) {
    const a = D.agents.get(key.slice(2));
    if (!a) return closePanel();
    const st = agentState(a, NOW);
    const mine = ideas.filter((i) => i.owner === a.id || a.claimed.has(i.id) || a.handed.has(i.id));
    h = `<div class="eyebrow" style="color:${a.color}">${esc(a.role)}, ${esc(a.model)}</div><h2 style="color:${a.color}">${esc(a.name)}</h2>
<div class="row"><span class="chip">${esc(st.label)}</span><span class="chip">${a.checksOk} gates passed</span>${a.checksFail ? `<span class="chip">${a.checksFail} failed</span>` : ''}${a.filed ? `<span class="chip">${a.filed} ideas filed</span>` : ''}</div>
<p>${esc(a.mission)}</p>
<h3>Workflow</h3><div class="wfp" style="--ac:${a.color}">${a.workflow.map((w, i) => `<span class="${i === a.step ? 'now' : ''}">${esc(w)}</span>`).join('')}</div>
<h3>Owns</h3><p style="margin:0;color:var(--dim)">${a.owns.map(esc).join(', ')}</p>
${mine.length ? `<h3>Its ideas</h3>${itemsHTML(mine, true)}` : ''}
${a.files.size ? `<h3>Files touched</h3><p style="margin:0;color:var(--dim);font-size:13px">${[...a.files].slice(0, 30).map(esc).join('<br>')}</p>` : ''}
<h3>Everything it did</h3>${a.events.length ? histHTML(a.events) : '<p style="color:var(--dim)">Hasn\'t started yet.</p>'}`;
  } else if (key.startsWith('c:')) {
    const s = key.slice(2), list = ideas.filter((i) => ringOf(i.status) === s);
    const byArea = S.areas.map((a) => ({ a, n: list.filter((i) => i.area === a.key).length })).filter((x) => x.n).sort((x, y) => y.n - x.n);
    const max = Math.max(1, ...byArea.map((x) => x.n));
    h = `<div class="eyebrow">Orbit</div><h2 style="color:${STAGE_COLOR[s]}">${esc(info[s]?.label || s)}</h2><div class="big">${list.length}</div><p style="color:var(--dim)">${esc(info[s]?.hint || '')}</p>
${byArea.length ? `<h3>By area</h3><div class="bars">${byArea.map((x) => `<div data-go="b:${x.a.key}" style="--c:${x.a.color}"><span>${esc(x.a.label)}</span><em style="width:${(x.n / max) * 200}px"></em>${x.n}</div>`).join('')}</div>` : ''}
${list.length ? `<h3>Ideas on this orbit</h3>${itemsHTML(list, s === 'building')}` : ''}`;
  } else if (key.startsWith('b:')) {
    const w = L.wedges.get(key.slice(2));
    if (!w) return closePanel();
    const list = ideas.filter((i) => keyOf(i) === w.area.key).sort((x, y) => STAGES.indexOf(y.status) - STAGES.indexOf(x.status));
    const bySt = [...STAGES, 'blocked', 'dropped'].map((s) => ({ s, n: list.filter((i) => i.status === s).length })).filter((x) => x.n);
    const max = Math.max(1, ...bySt.map((x) => x.n));
    h = `<div class="eyebrow">Area of the app</div><h2 style="color:${w.area.color}">${esc(w.area.label)}</h2><div class="big">${list.length}</div>
<h3>How far along</h3><div class="bars">${bySt.map((x) => `<div data-go="c:${ringOf(x.s)}" style="--c:${STAGE_COLOR[x.s]}"><span>${esc(info[x.s]?.label || x.s)}</span><em style="width:${(x.n / max) * 200}px"></em>${x.n}</div>`).join('')}</div>
<h3>Every idea here</h3>${itemsHTML(list, true)}`;
  } else if (key === 'sun') {
    const landed = ideas.filter((i) => i.status === 'verified' || i.status === 'shipped');
    h = `<div class="eyebrow">The sun</div><h2 style="color:var(--gold)">Brain Navigator</h2>
<p>The app everything orbits. An idea starts far out in the idea bank and falls inward, ring by ring, until it lands here: built, checked live, and shipped.</p>
${SNAP ? '' : '<h3>Right now, in the Simulator</h3><img class="simshot" alt="The app in the Simulator" src="/api/sim.png?t=' + Math.floor(Date.now() / 4000) + '">'}
<h3>Landed this round</h3>${landed.length ? itemsHTML(landed) : '<p style="color:var(--dim)">Nothing yet.</p>'}`;
  }
  if (!h) return;
  const top = panelEl._key === key ? panelEl.scrollTop : 0;
  if (quiet && key === 'sun' && panelEl._key === 'sun') { const img = panelEl.querySelector('.simshot'); if (img) return; }
  panelEl.innerHTML = `<button class="x" aria-label="Close">×</button>${h}`;
  panelEl.scrollTop = top;
  panelEl._key = key;
  panelEl.classList.add('open');
}
function closePanel() { panelEl.classList.remove('open'); panelEl._key = null; sel = null; render(); }

function rectOf(key) {
  if (key === 'fit') return L.bounds;
  if (key === 'sun') return { x: -SUN * 1.5, y: -SUN * 1.5, w: SUN * 3, h: SUN * 3 };
  if (key.startsWith('i:')) { const p = L.pos.get(key.slice(2)); return p && { x: p.x - 320, y: p.y - 260, w: 640, h: 560 }; }
  if (key.startsWith('a:')) { const p = L.apos.get(key.slice(2)); return p && { x: p.x - 420, y: p.y - 260, w: 840, h: 1000 }; }
  if (key.startsWith('c:')) { const s = key.slice(2), R = (s === 'dropped' ? L.dropR : s === 'backlog' ? L.outer : RING[s]) + 260; return { x: -R, y: -R, w: R * 2, h: R * 2 }; }
  if (key.startsWith('b:')) {
    const w = L.wedges.get(key.slice(2));
    if (!w) return null;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
    for (let a = w.a0; a <= w.a1 + 1e-6; a += (w.a1 - w.a0) / 8) { add(Math.cos(a) * (SUN + 200), Math.sin(a) * (SUN + 200)); add(Math.cos(a) * (L.labelR + 120), Math.sin(a) * (L.labelR + 120)); }
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
}
function go(key) {
  if (key === 'fit') { sel = null; panelEl.classList.remove('open'); panelEl._key = null; render(); return fitAll(); }
  const r = rectOf(key);
  if (!r) return;
  sel = key;
  panel(key);
  render();
  flyTo(r, key.startsWith('i:') ? 1.5 : key.startsWith('a:') ? 1 : key === 'sun' ? 0.8 : 3, key.startsWith('i:') ? 80 : 30);
}
panelEl.addEventListener('click', (e) => {
  if (e.target.closest('.x')) return closePanel();
  const g = e.target.closest('[data-go]');
  if (g) go(g.dataset.go);
});
for (const id of ['crumbs', 'dock']) document.getElementById(id).addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });

// ---------- input ----------
const ptrs = new Map();
let drag = null, pinch = null;
stage.addEventListener('pointerdown', (e) => {
  fly++;
  try { stage.setPointerCapture(e.pointerId); } catch {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: 0, target: e.target };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k }; drag = null; }
  stage.classList.add('moving');
  tipOff();
});
stage.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return tipAt(e);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    zoomAt((pinch.k * Math.hypot(a.x - b.x, a.y - b.y)) / pinch.d / view.k, (a.x + b.x) / 2, (a.y + b.y) / 2);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
    if (drag.moved > 4) { stage.classList.add('drag'); view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
  }
});
const up = (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && drag.moved <= 4 && e.type === 'pointerup') clickAt(drag.target);
  if (!ptrs.size) { drag = null; stage.classList.remove('drag', 'moving'); }
};
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);
stage.addEventListener('pointerleave', tipOff);
function clickAt(t) {
  const k = t.closest?.('[data-key]')?.dataset.key;
  if (!k) { if (sel) closePanel(); return; }
  go(k);
}
stage.addEventListener('dblclick', (e) => { if (!e.target.closest('.dot,.planet,.sun')) zoomAt(2, e.clientX, e.clientY); });
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  fly++;
  tipOff();
  const mouse = !e.ctrlKey && e.deltaX === 0 && Math.abs(e.deltaY) >= 40 && e.deltaMode === 0 && Number.isInteger(e.deltaY);
  if (e.ctrlKey || mouse || e.deltaMode === 1) zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : e.deltaMode === 1 ? 0.05 : 0.0018)), e.clientX, e.clientY);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive: false });

// hover: a quick card for whatever is under the pointer
const tip = document.getElementById('tip');
function tipOff() { tip.classList.remove('on'); }
function tipAt(e) {
  const t = e.target.closest?.('.dot,.planet,.sun,.rl,.al,.wedge,.hitr');
  if (!t || !D) return tipOff();
  const k = t.dataset.key, info = STAGE_INFO();
  let h = '';
  if (k.startsWith('i:')) {
    const it = D.ideas.get(k.slice(2));
    if (!it) return tipOff();
    const o = it.owner && D.agents.get(it.owner);
    h = `<span class="m">${esc(it.id)}, ${esc(AREA.get(it.area)?.label || it.area)}</span><b>${esc(it.title)}</b><span class="m">${esc(info[it.status]?.label || it.status)}${o ? `, with ${esc(o.name)}` : ''}</span>`;
  } else if (k.startsWith('a:')) {
    const a = D.agents.get(k.slice(2));
    const cur = a.cur && D.ideas.get(a.cur);
    h = `<span class="m">${esc(a.role)}, ${esc(a.model)}</span><b style="color:${a.color}">${esc(a.name)}</b><span class="m">${esc(agentState(a, NOW).label)}${cur ? `: ${esc(cur.title)}` : ''}</span>`;
  } else if (k === 'sun') h = '<b>Brain Navigator</b><span class="m">The app everything orbits. Tap to see it live.</span>';
  else if (k.startsWith('c:')) { const s = k.slice(2); h = `<b style="color:${STAGE_COLOR[s]}">${esc(info[s]?.label || s)}</b><span class="m">${esc(info[s]?.hint || '')}</span>`; }
  else if (k.startsWith('b:')) { const w = L.wedges.get(k.slice(2)); if (!w) return tipOff(); h = `<b style="color:${w.area.color}">${esc(w.area.label)}</b><span class="m">${w.n} ideas in this slice of the sky</span>`; }
  tip.innerHTML = h;
  const x = Math.min(innerWidth - 320, e.clientX + 16), y = Math.min(innerHeight - 100, e.clientY + 16);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  tip.classList.add('on');
}

document.getElementById('zin').onclick = () => zoomAt(1.6, innerWidth / 2, innerHeight / 2);
document.getElementById('zout').onclick = () => zoomAt(1 / 1.6, innerWidth / 2, innerHeight / 2);
document.getElementById('zfit').onclick = () => go('fit');
document.querySelectorAll('#lod span').forEach((s) => s.addEventListener('click', () => { const k = [0.12, 0.35, 0.9][+s.dataset.l]; zoomAt(k / view.k, innerWidth / 2, innerHeight / 2); }));
document.querySelector('#mini').addEventListener('pointerdown', (e) => {
  const cv = document.querySelector('#mini canvas'), r = cv.getBoundingClientRect(), m = cv._m;
  const mx = ((e.clientX - r.left) / r.width) * cv.width, my = ((e.clientY - r.top) / r.height) * cv.height;
  const wx = (mx - m.o) / m.s, wy = (my - m.o) / m.s;
  view.x = innerWidth / 2 - wx * view.k; view.y = innerHeight / 2 - wy * view.k;
  apply();
});
const search = document.getElementById('search');
search.addEventListener('input', () => { query = search.value; render(); });
search.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = query.trim().toLowerCase();
    if (!q) return;
    const a = [...D.agents.values()].find((a) => a.name.toLowerCase().startsWith(q));
    if (a) return go('a:' + a.id);
    const hit = [...D.ideas.values()].find((it) => it.id.toLowerCase() === q) || [...D.ideas.values()].find((it) => it.id.toLowerCase().includes(q) || it.title.toLowerCase().includes(q) || (it.detail || '').toLowerCase().includes(q));
    if (hit) go('i:' + hit.id);
  }
  if (e.key === 'Escape') { search.value = ''; query = ''; search.blur(); render(); }
});
addEventListener('keydown', (e) => {
  if (e.target === search) return;
  if (e.key === '/') { e.preventDefault(); search.focus(); }
  else if (e.key === '0' || e.key === 'f') go('fit');
  else if (e.key === '+' || e.key === '=') zoomAt(1.6, innerWidth / 2, innerHeight / 2);
  else if (e.key === '-') zoomAt(1 / 1.6, innerWidth / 2, innerHeight / 2);
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') {
    // Step back out: idea → its orbit → the whole system.
    if (sel?.startsWith('i:')) { const it = D.ideas.get(sel.slice(2)); go(it ? 'c:' + ringOf(it.status) : 'fit'); }
    else go('fit');
  }
});
addEventListener('resize', () => { apply(); timeline(cursor == null ? S.events : S.events.slice(0, cursor)); });

// ---------- replay ----------
let playT = null;
const playBtn = document.getElementById('play');
function togglePlay() {
  if (playT) { clearTimeout(playT); playT = null; playBtn.textContent = 'Resume'; return; }
  if (cursor == null || cursor >= S.events.length) cursor = 0;
  playBtn.textContent = 'Pause';
  const wait = Math.max(160, Math.min(900, 30000 / Math.max(1, S.events.length)));
  const step = () => {
    if (cursor >= S.events.length) { playT = null; cursor = null; playBtn.textContent = 'Replay the day'; render(); return; }
    cursor++;
    render([S.events[cursor - 1]]);
    playT = setTimeout(step, wait);
  };
  render();
  step();
}
playBtn.onclick = togglePlay;
document.getElementById('range').addEventListener('input', (e) => {
  if (playT) { clearTimeout(playT); playT = null; playBtn.textContent = 'Resume'; }
  const v = +e.target.value;
  cursor = v >= S.events.length ? null : v;
  if (cursor == null) playBtn.textContent = 'Replay the day';
  render();
});
document.getElementById('live').addEventListener('click', () => { if (SNAP) return; if (playT) clearTimeout(playT); playT = null; cursor = null; playBtn.textContent = 'Replay the day'; render(); });

// ---------- live ----------
function adopt(s) { S = s; AREA = new Map(S.areas.map((a) => [a.key, a])); }
async function poll() {
  try {
    const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
    const before = S.events.length;
    adopt(s);
    if (cursor == null) render(s.events.slice(before));
    else timeline(S.events.slice(0, cursor));
  } catch {}
  setTimeout(poll, 3000);
}
function simTick() {
  const img = panelEl._key === 'sun' && panelEl.querySelector('.simshot');
  if (img && !document.hidden) img.src = `/api/sim.png?t=${Date.now()}`;
  setTimeout(simTick, 4000);
}

(async function start() {
  adopt(SNAP || (await (await fetch('/api/state', { cache: 'no-store' })).json()));
  render();
  // Arrive from deep space, then settle on the whole system.
  const v = viewport(), k = Math.min(v.w, v.h) / L.bounds.w;
  view.k = k * 0.3; view.x = v.x + v.w / 2; view.y = v.y + v.h / 2;
  apply();
  frame(() => fitAll());
  setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 7000);
  addEventListener('pointerdown', () => { document.getElementById('hint').style.opacity = 0; }, { once: true });
  if (!SNAP) { setTimeout(poll, 3000); simTick(); }
})();
</script>
</body>
